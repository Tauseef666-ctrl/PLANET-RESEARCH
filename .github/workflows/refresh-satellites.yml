name: Refresh Satellite Data

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch satellites
        run: npm run fetch:satellites

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: 'ci/satellite-data-refresh'
          title: 'chore: refresh satellite data'
          commit-message: 'chore: refresh satellite data'
          delete-branch: true
          base: 'main'
